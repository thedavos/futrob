<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 670 823" width="622" height="775">
<defs>
  <filter id="halo" x="-20%" y="-16%" width="140%" height="132%" primitiveUnits="userSpaceOnUse">
    <feMorphology in="SourceAlpha" operator="dilate" radius="18" result="spread"/>
    <feFlood flood-color="#1C2023" result="haloColor"/>
    <feComposite in="haloColor" in2="spread" operator="in" result="halo"/>
    <feMerge>
      <feMergeNode in="halo"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
