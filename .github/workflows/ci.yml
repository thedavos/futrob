name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Type-aware lint needs the generated TanStack route tree.
      - run: npm run generate:routes
      # Guard: packages/ui/src/tokens.css must match @futrob/ui-tokens data.
      - run: npm run generate:css:check -w @futrob/ui-tokens
      - run: npm run check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate:routes
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: futrob_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: futrob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate:routes
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:coverage
      - name: Official selection HTTP on Postgres
        run: npm run test -- --run --project api apps/api/src/http/routes/official-selection
        env:
          TEST_DATABASE_URL: postgresql://postgres:futrob_test@localhost:5432/futrob_test
      - name: Activity feed on Postgres
        run: >-
          npm run test -- --run --project api apps/api/src/adapters/notifications
          apps/api/src/di/official-selection.composition.integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:futrob_test@localhost:5432/futrob_test

  build:
    name: Build & Bundle Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build product client
        run: npm run build
        env:
          NODE_ENV: production
      - name: Enforce product client bundle budget
        run: npm run bundle:budget
        env:
          BUNDLE_ENTRY_GZIP_KIB: "250"
          # Per-file gzip cap for non-entry JS. Recharts stays on the
          # statistics charts chunk; React, Zod, and Base UI are split
          # out of the shared src-* chunk in apps/web/vite.config.ts.
          BUNDLE_LAZY_GZIP_KIB: "120"
