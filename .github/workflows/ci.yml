name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Type-aware lint needs the generated TanStack route tree.
      - run: npm run generate:routes
      # Guard: packages/ui/src/tokens.css must match @futrob/ui-tokens data.
      - run: npm run generate:css:check -w @futrob/ui-tokens
      - run: npm run check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate:routes
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate:routes
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:coverage

  build:
    name: Build & Bundle Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build product client
        run: npm run build
        env:
          NODE_ENV: production
      - name: Enforce product client bundle budget
        run: npm run bundle:budget
        env:
          BUNDLE_ENTRY_GZIP_KIB: "250"
          # The lazy/shared floor is set by the vendor core chunk (_src-*.js:
          # Tailwind runtime + brand logo) shared by every route, not by
          # per-route product code. Revisit if it grows past this again.
          BUNDLE_LAZY_GZIP_KIB: "120"
