name: Verifications

on:
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
        description: PR number to audit
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: audit-${{ inputs.pr_number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Cursor agent audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Type-aware linting and tests need the generated TanStack route tree.
      - run: npm run generate:routes
      - name: Install Cursor SDK
        run: npm install @cursor/sdk --no-save
      - name: Run Cursor agent verifications
        run: node scripts/cursor-audit.mjs
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
