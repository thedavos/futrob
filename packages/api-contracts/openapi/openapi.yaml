      operationId: assignSuperuser
      tags:
        - authorization
      summary: Assign an audited platform superuser
      parameters:
        - *a2
        - name: actorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Assigned superuser
          headers:
            X-Request-ID: *a1
        "403":
          $ref: "#/components/responses/ApiError"
    delete:
      operationId: revokeSuperuser
      tags:
        - authorization
      summary: Revoke an audited platform superuser
      parameters:
        - *a2
        - name: actorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked superuser
          headers:
            X-Request-ID: *a1
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Optional in MVP scaffold; required when identity is wired.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller-supplied UUID. Invalid values are replaced; the
        effective value is returned in the response.
      schema:
        type: string
        format: uuid
  headers:
    RequestId:
      description: Correlation UUID for support and operational diagnostics.
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: Seconds until this rate-limited operation can be retried.
      schema:
        type: integer
        minimum: 1
  schemas:
    EffectiveAccess:
      type: object
      required:
        - actorId
        - scope
        - roles
        - permissions
      properties:
        actorId:
          type: string
        scope:
          type: object
          properties:
            organizationId:
              type: string
            competitionId:
              type: string
            teamId:
              type: string
            encounterId:
              type: string
        roles:
          type: array
          items:
            type: object
            required:
              - scopeType
              - scopeId
              - role
            properties:
              scopeType:
                type: string
                enum:
                  - platform
                  - organization
                  - competition
                  - team
                  - encounter
              scopeId:
                type: string
              role:
                type: string
        permissions:
          type: array
          items:
            type: object
            required:
              - permission
              - allowed
              - decidedAt
            properties:
              permission:
                type: string
              allowed:
                type: boolean
              decidedAt:
                type: string
                enum:
                  - platform
                  - organization
                  - competition
                  - team
                  - encounter
    UpsertAccessGrantRequest:
      type: object
      required:
        - targetActorId
        - organizationId
        - permission
        - effect
        - scopeType
        - scopeId
      properties:
        id:
          type: string
          format: uuid
        targetActorId:
          type: string
        organizationId:
          type:
            - string
            - "null"
        competitionId:
          type: string
        teamId:
          type: string
        encounterId:
          type: string
        permission:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
        scopeType:
          type: string
          enum:
            - platform
            - organization
            - competition
            - team
            - encounter
        scopeId:
          type: string
        reason:
          type: string
          maxLength: 500
    AccessGrant:
      type: object
      required:
        - id
        - organizationId
        - actorId
        - permission
        - effect
        - scopeType
        - scopeId
        - grantedByActorId
        - reason
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type:
            - string
            - "null"
        actorId:
          type: string
        permission:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
        scopeType:
          type: string
          enum:
            - platform
            - organization
            - competition
            - team
            - encounter
        scopeId:
          type: string
        grantedByActorId:
          type: string
        reason:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChangeOrganizationRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - organizer
            - staff
            - member
        reason:
          type: string
          maxLength: 500
    ChangeCompetitionRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - staff
            - captain
            - player
        reason:
          type: string
          maxLength: 500
    CompetitionRoleAssignment:
      type: object
      required:
        - organizationId
        - competitionId
        - actorId
        - role
        - createdAt
      properties:
        organizationId:
          type: string
        competitionId:
          type: string
        actorId:
          type: string
        role:
          type: string
          enum:
            - staff
            - captain
            - player
        createdAt:
          type: string
          format: date-time
    PingResponse:
      type: object
      required:
        - ok
        - service
        - apiVersion
      properties:
        ok:
          type: boolean
          const: true
        service:
          type: string
          const: futrob
        apiVersion:
          type: string
          const: v1
    ApiError:
      type: object
      required:
        - code
        - messageKey
      properties:
        code:
          type: string
        messageKey:
          type: string
        requestId:
          type: string
          format: uuid
        retryAfterSeconds:
          type: integer
          minimum: 1
        details:
          type: object
          additionalProperties: false
          properties:
            organizationId:
              type: string
            role:
              type: string
            status:
              type: string
            path:
              type: string
            body: {}
            issues: {}
            externalClubId:
              type: string
            cause: {}
            completedPath:
              type: string
            requestedPath:
              type: string
    ExternalClub:
      type: object
      required:
        - providerKey
        - externalClubId
        - name
        - platform
        - gameEdition
        - imageUrl
      properties:
        providerKey:
          type: string
          enum:
            - ea-clubs
            - manual
            - screenshot-ocr
        externalClubId:
          type: string
        name:
          type: string
        platform:
          type: string
        gameEdition:
          type: string
        imageUrl:
          type:
            - string
            - "null"
          format: uri
    ProviderMatch:
      type: object
      required:
        - id
        - provider
        - game
        - occurredAt
        - home
        - away
        - players
        - metadata
      properties:
        id:
          type: string
        provider:
          type: object
          required:
            - key
            - externalMatchId
          properties:
            key:
              type: string
              enum:
                - ea-clubs
                - manual
                - screenshot-ocr
            externalMatchId:
              type: string
        game:
          type: object
          required:
            - edition
            - platform
            - mode
          properties:
            edition:
              type: string
            platform:
              type: string
            mode:
              type: string
        occurredAt:
          type: string
          format: date-time
        home:
          $ref: "#/components/schemas/ProviderMatchTeam"
        away:
          $ref: "#/components/schemas/ProviderMatchTeam"
        players:
          type: array
          items:
            $ref: "#/components/schemas/ProviderPlayerMatchStats"
        metadata:
          type: object
          required:
            - durationSeconds
            - wasDisconnected
            - winnerByForfeit
            - completeness
          properties:
            durationSeconds:
              type:
                - number
                - "null"
            wasDisconnected:
              type: boolean
            winnerByForfeit:
              type: boolean
            completeness:
              type: string
              enum:
                - complete
                - partial
                - unknown
    ProviderMatchTeam:
      type: object
      required:
        - externalClubId
        - name
        - goals
        - imageUrl
      properties:
        externalClubId:
          type: string
        name:
          type: string
        goals:
          type: number
        imageUrl:
          type:
            - string
            - "null"
          format: uri
    ProviderPlayerMatchStats:
      type: object
      required:
        - externalPlayerId
        - displayName
        - externalClubId
        - position
        - minutesPlayed
        - goals
        - assists
        - shots
        - passAttempts
        - passesMade
        - tackleAttempts
        - tacklesMade
        - saves
        - yellowCards
        - redCards
        - isMvp
        - rating
      properties:
        externalPlayerId:
          type: string
        displayName:
          type: string
        externalClubId:
          type: string
        position:
          type:
            - string
            - "null"
        minutesPlayed:
          type:
            - number
            - "null"
        goals:
          type:
            - number
            - "null"
        assists:
          type:
            - number
            - "null"
        shots:
          type:
            - number
            - "null"
        passAttempts:
          type:
            - number
            - "null"
        passesMade:
          type:
            - number
            - "null"
        tackleAttempts:
          type:
            - number
            - "null"
        tacklesMade:
          type:
            - number
            - "null"
        saves:
          type:
            - number
            - "null"
        yellowCards:
          type:
            - number
            - "null"
        redCards:
          type:
            - number
            - "null"
        isMvp:
          type:
            - boolean
            - "null"
        rating:
          type:
            - number
            - "null"
    SearchClubsResponse:
      type: object
      required:
        - clubs
      properties:
        clubs:
          type: array
          items:
            $ref: "#/components/schemas/ExternalClub"
    GetClubMatchesResponse:
      type: object
      required:
        - matches
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/ProviderMatch"
    EnqueueProviderSyncJobRequest:
      type: object
      required:
        - organizationId
        - providerKey
        - externalClubId
        - platform
        - gameEdition
        - matchType
        - maxResultCount
      properties:
        organizationId:
          type: string
          minLength: 1
        providerKey:
          type: string
          enum:
            - ea-clubs
        externalClubId:
          type: string
          minLength: 1
        platform:
          type: string
          minLength: 1
        gameEdition:
          type: string
          minLength: 1
        matchType:
          type: string
          minLength: 1
        maxResultCount:
          type: integer
          minimum: 1
          maximum: 100
    ProviderSyncJobResponse:
      type: object
      required:
        - id
        - organizationId
        - providerKey
        - status
        - attempt
        - maxAttempts
        - requestId
        - availableAt
        - leaseExpiresAt
        - updatedAt
      properties:
        id:
          type: string
          minLength: 1
        organizationId:
          type: string
          minLength: 1
        providerKey:
          type: string
          enum:
            - ea-clubs
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - retry_scheduled
            - dead
        attempt:
          type: integer
          minimum: 0
        maxAttempts:
          type: integer
          minimum: 1
        requestId:
          type: string
          minLength: 1
        availableAt:
          type:
            - string
            - "null"
          format: date-time
        leaseExpiresAt:
          type:
            - string
            - "null"
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastErrorCode:
          type: string
          minLength: 1
    ProviderHealthResponse:
      type: object
      required:
        - providerKey
        - status
        - circuitState
        - observedAt
        - windowStartedAt
        - sampleSize
        - lastSuccessfulAt
        - lastFailureAt
        - averageLatencyMs
        - successCount
        - failureCount
        - cache
      properties:
        providerKey:
          type: string
          enum:
            - ea-clubs
            - manual
            - screenshot-ocr
        status:
          type: string
          enum:
            - healthy
            - degraded
            - unavailable
            - unknown
        circuitState:
          type: string
          enum:
            - closed
            - open
            - half_open
        observedAt:
          type: string
          format: date-time
        windowStartedAt:
          type: string
          format: date-time
        sampleSize:
          type: integer
          minimum: 0
        lastSuccessfulAt:
          type:
            - string
            - "null"
          format: date-time
        lastFailureAt:
          type:
            - string
            - "null"
          format: date-time
        averageLatencyMs:
          type:
            - integer
            - "null"
          minimum: 0
        successCount:
          type: integer
          minimum: 0
        failureCount:
          type: integer
          minimum: 0
        cache:
          type: object
          required:
            - hits
            - misses
            - stale
          properties:
            hits:
              type: integer
              minimum: 0
            misses:
              type: integer
              minimum: 0
            stale:
              type: integer
              minimum: 0
    CompetitionDraftInput:
      type: object
      required:
        - name
        - gameEdition
        - platform
        - region
        - timeZone
        - format
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        gameEdition:
          type: string
          minLength: 1
          maxLength: 40
        platform:
          type: string
          enum:
            - playstation
            - xbox
            - pc
            - nintendo-switch-1
            - nintendo-switch-2
        region:
          type: string
          enum:
            - america
            - south-america
            - north-central-america
            - europe
            - africa
            - asia
            - middle-east
            - oceania
        timeZone:
          type: string
          minLength: 1
          maxLength: 100
        format:
          type: string
          enum:
            - league
            - knockout
            - groups-knockout
            - league-playoffs
    CompetitionMatchRules:
      type: object
      required:
        - officialMatchesPerEncounter
        - resolutionMode
        - winPoints
        - drawPoints
        - lossPoints
        - allowRescheduling
        - maxReschedulesPerTeam
        - minimumRescheduleNoticeHours
        - rescheduleRequiresOpponentApproval
        - rescheduleRequiresOrganizerApproval
      properties:
        officialMatchesPerEncounter:
          type: integer
          enum:
            - 1
            - 2
        resolutionMode:
          type: string
          enum:
            - independent_matches
            - aggregate_score
        winPoints:
          type: number
        drawPoints:
          type: number
        lossPoints:
          type: number
        allowRescheduling:
          type: boolean
        maxReschedulesPerTeam:
          type:
            - integer
            - "null"
          minimum: 0
        minimumRescheduleNoticeHours:
          type: integer
          minimum: 0
        rescheduleRequiresOpponentApproval:
          type: boolean
        rescheduleRequiresOrganizerApproval:
          type: boolean
    Competition:
      type: object
      required:
        - id
        - organizationId
        - name
        - status
        - modality
        - gameEdition
        - platform
        - region
        - timeZone
        - format
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - draft
            - published
            - paused
            - finished
            - archived
        modality:
          type: string
          const: fc-clubs
        gameEdition:
          type: string
        platform:
          type: string
          enum:
            - playstation
            - xbox
            - pc
            - nintendo-switch-1
            - nintendo-switch-2
        region:
          type: string
          enum:
            - america
            - south-america
            - north-central-america
            - europe
            - africa
            - asia
            - middle-east
            - oceania
        timeZone:
          type: string
        format:
          type: string
          enum:
            - league
            - knockout
            - groups-knockout
            - league-playoffs
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ListAccessibleCompetitionsResponse:
      type: object
      required:
        - competitions
      properties:
        competitions:
          type: array
          items:
            type: object
            required:
              - competition
              - role
            properties:
              competition:
                $ref: "#/components/schemas/Competition"
              role:
                type: string
                enum:
                  - staff
                  - captain
                  - vice_captain
                  - player
    EncounterScheduleSnapshot:
      type: object
      required:
        - encounterId
        - organizationId
        - competitionId
        - homeTeamId
        - awayTeamId
        - scheduledStartAt
        - officialMatchCount
        - homeExternalClubId
        - awayExternalClubId
        - providerKey
      properties:
        encounterId:
          type: string
        organizationId:
          type: string
        competitionId:
          type: string
        homeTeamId:
          type: string
        awayTeamId:
          type: string
        scheduledStartAt:
          type: string
          format: date-time
        officialMatchCount:
          type: integer
          enum:
            - 1
            - 2
        homeExternalClubId:
          type:
            - string
            - "null"
        awayExternalClubId:
          type:
            - string
            - "null"
        providerKey:
          type:
            - string
            - "null"
    FixtureParticipantSlot:
      oneOf:
        - type: object
          required:
            - kind
            - teamId
          properties:
            kind:
              const: team
            teamId:
              type: string
        - type: object
          required:
            - kind
          properties:
            kind:
              const: bye
        - type: object
          required:
            - kind
            - encounterId
          properties:
            kind:
              const: winner
            encounterId:
              type: string
        - type: object
          required:
            - kind
            - stageId
            - groupId
            - rank
          properties:
            kind:
              const: group-rank
            stageId:
              type: string
            groupId:
              type: string
            rank:
              type: integer
              minimum: 1
        - type: object
          required:
            - kind
            - stageId
            - rank
          properties:
            kind:
              const: stage-rank
            stageId:
              type: string
            rank:
              type: integer
              minimum: 1
    FixtureEncounter:
      type: object
      required:
        - id
        - stageId
        - roundId
        - order
        - home
        - away
        - scheduledStartAt
        - officialMatchCount
        - series
      properties:
        id:
          type: string
        stageId:
          type: string
        roundId:
          type: string
        order:
          type: integer
          minimum: 1
        groupId:
          type: string
        home:
          $ref: "#/components/schemas/FixtureParticipantSlot"
        away:
          $ref: "#/components/schemas/FixtureParticipantSlot"
        scheduledStartAt:
          type: string
          format: date-time
        officialMatchCount:
          type: integer
          enum:
            - 1
            - 2
        series:
          oneOf:
            - $ref: "#/components/schemas/FixtureSeries"
            - type: "null"
    FixtureSeries:
      type: object
      required:
        - id
        - resolutionMode
        - officialMatches
      properties:
        id:
          type: string
        resolutionMode:
          type: string
          enum:
            - independent_matches
            - aggregate_score
        officialMatches:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            required:
              - id
              - slot
            properties:
              id:
                type: string
              slot:
                type: integer
                enum:
                  - 1
                  - 2
    FixtureRound:
      type: object
      required:
        - id
        - stageId
        - number
        - scheduledStartAt
        - encounters
      properties:
        id:
          type: string
        stageId:
          type: string
        number:
          type: integer
          minimum: 1
        scheduledStartAt:
          type: string
          format: date-time
        encounters:
          type: array
          items:
            $ref: "#/components/schemas/FixtureEncounter"
    FixtureStage:
      type: object
      required:
        - id
        - kind
        - order
        - rounds
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - league
            - groups
            - knockout
            - playoffs
        order:
          type: integer
          minimum: 1
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/FixtureRound"
    FixturePlan:
      type: object
      required:
        - id
        - revision
        - status
        - generationKey
        - organizationId
        - competitionId
        - rulesVersion
        - generationVersion
        - format
        - timeZone
        - homeAndAway
        - seed
        - stages
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - active
            - superseded
        generationKey:
          type: string
        organizationId:
          type: string
        competitionId:
          type: string
        rulesVersion:
          type: integer
          minimum: 1
        generationVersion:
          type: integer
          minimum: 1
        format:
          type: string
          enum:
            - league
            - knockout
            - groups-knockout
            - league-playoffs
        timeZone:
          type: string
        homeAndAway:
          type: boolean
        seed:
          type: array
          minItems: 2
          items:
            type: string
        stages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FixtureStage"
    GenerateCompetitionFixtureRequest:
      type: object
      required:
        - generationVersion
        - startsAt
        - roundIntervalDays
        - homeAndAway
      properties:
        generationVersion:
          type: integer
          minimum: 1
        startsAt:
          type: string
          format: date-time
        roundIntervalDays:
          type: integer
          minimum: 1
        homeAndAway:
          type: boolean
          default: false
        seed:
          type: array
          minItems: 2
          items:
            type: string
        groups:
          type: object
          required:
            - count
            - qualifiersPerGroup
          properties:
            count:
              type: integer
              minimum: 2
            qualifiersPerGroup:
              type: integer
              minimum: 1
        playoffs:
          type: object
          required:
            - teamCount
          properties:
            teamCount:
              type: integer
              minimum: 2
    EditFixtureEncounterRequest:
      type: object
      required:
        - reason
      properties:
        scheduledStartAt:
          type: string
          format: date-time
        homeTeamId:
          type: string
        awayTeamId:
          type: string
        reason:
          type: string
          minLength: 1
          maxLength: 500
        requestId:
          type: string
          format: uuid
    CompetitionRules:
      type: object
      required:
        - version
        - regularStage
        - knockoutStage
        - awayGoalsEnabled
        - maxRosterSize
        - createdAt
      properties:
        version:
          type: integer
          minimum: 1
        regularStage:
          anyOf:
            - $ref: "#/components/schemas/CompetitionMatchRules"
            - type: "null"
        knockoutStage:
          anyOf:
            - $ref: "#/components/schemas/CompetitionMatchRules"
            - type: "null"
        awayGoalsEnabled:
          type: boolean
          const: false
        maxRosterSize:
          anyOf:
            - type: integer
              minimum: 1
            - type: "null"
        createdAt:
          type: string
          format: date-time
    CompetitionDraft:
      type: object
      required:
        - competition
        - rules
      properties:
        competition:
          $ref: "#/components/schemas/Competition"
        rules:
          $ref: "#/components/schemas/CompetitionRules"
    UpdateCompetitionDraftInput:
      allOf:
        - $ref: "#/components/schemas/CompetitionDraftInput"
        - type: object
          required:
            - rules
          properties:
            rules:
              type: object
              required:
                - regularStage
                - knockoutStage
                - maxRosterSize
              properties:
                regularStage:
