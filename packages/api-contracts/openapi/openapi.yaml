openapi: 3.1.0
info:
  title: Futrob Private API
  version: 0.1.0
  description: Private HTTP API for Futrob clients (web, Flutter, scripts). Not a
    public third-party API.
servers:
  - url: /api/v1
    description: Same Worker as apps/web
security:
  - bearerAuth: []
tags:
  - name: meta
    description: Health and discovery
  - name: game-data
    description: Provider observations (neutral DTOs; EA stays server-side)
  - name: onboarding
    description: Actor onboarding state and path completion
  - name: organizations
    description: Organizations and tenant memberships
  - name: players
    description: Personal player profile and game accounts
  - name: competitions
    description: Organization-scoped competition drafts
  - name: authorization
    description: Contextual roles, grants and effective access
  - name: encounters
    description: Persisted encounter schedule read models
  - name: fixtures
    description: Deterministic competition fixture graphs
paths:
  /meta/ping:
    get:
      operationId: metaPing
      tags:
        - meta
      summary: Health ping
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
          headers:
            X-Request-ID: &a1
              $ref: "#/components/headers/RequestId"
      parameters:
        - &a2
          $ref: "#/components/parameters/RequestId"
  /openapi.json:
    get:
      operationId: getOpenApiJson
      tags:
        - meta
      summary: OpenAPI document (JSON)
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 JSON
          content:
            application/json:
              schema:
                type: object
          headers:
            X-Request-ID: *a1
      parameters:
        - *a2
  /openapi.yaml:
    get:
      operationId: getOpenApiYaml
      tags:
        - meta
      summary: OpenAPI document (YAML)
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 YAML
          content:
            application/yaml:
              schema:
                type: string
          headers:
            X-Request-ID: *a1
      parameters:
        - *a2
  /game-data/clubs/search:
    get:
      operationId: searchExternalClubs
      tags:
        - game-data
      summary: Search external clubs via a game-data provider
      parameters:
        - *a2
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: providerKey
          in: query
          required: false
          schema:
            type: string
            enum:
              - ea-clubs
              - manual
              - screenshot-ocr
            default: ea-clubs
        - name: platform
          in: query
          required: false
          schema:
            type: string
            default: common-gen5
        - name: gameEdition
          in: query
          required: false
          schema:
            type: string
            default: fc26
      responses:
        "200":
          description: Matching clubs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchClubsResponse"
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/ApiError"
  /game-data/clubs/{externalClubId}:
    get:
      operationId: getExternalClub
      tags:
        - game-data
      summary: Get external club info
      parameters:
        - *a2
        - name: externalClubId
          in: path
          required: true
          schema:
            type: string
        - name: providerKey
          in: query
          required: false
          schema:
            type: string
            enum:
              - ea-clubs
              - manual
              - screenshot-ocr
            default: ea-clubs
        - name: platform
          in: query
          required: false
          schema:
            type: string
            default: common-gen5
        - name: gameEdition
          in: query
          required: false
          schema:
            type: string
            default: fc26
      responses:
        "200":
          description: Club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalClub"
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "502":
          $ref: "#/components/responses/ApiError"
  /game-data/clubs/{externalClubId}/matches:
    get:
      operationId: getRecentProviderMatches
      tags:
        - game-data
      summary: List recent provider matches for a club
      parameters:
        - *a2
        - name: externalClubId
          in: path
          required: true
          schema:
            type: string
        - name: providerKey
          in: query
          required: false
          schema:
            type: string
            enum:
              - ea-clubs
              - manual
              - screenshot-ocr
            default: ea-clubs
        - name: platform
          in: query
          required: false
          schema:
            type: string
            default: common-gen5
        - name: gameEdition
          in: query
          required: false
          schema:
            type: string
            default: fc26
        - name: matchType
          in: query
          required: false
          schema:
            type: string
            default: friendlyMatch
        - name: maxResultCount
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetClubMatchesResponse"
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "502":
          $ref: "#/components/responses/ApiError"
  /internal/game-data/providers/{providerKey}/health:
    get:
      operationId: getProviderHealth
      tags:
        - game-data
      summary: Get a sanitized provider health snapshot
      parameters:
        - *a2
        - name: providerKey
          in: path
          required: true
          schema:
            type: string
            enum:
              - ea-clubs
              - manual
              - screenshot-ocr
      responses:
        "200":
          description: Sanitized provider health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderHealthResponse"
          headers:
            X-Request-ID: *a1
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /internal/game-data/sync-jobs:
    post:
      operationId: persistProviderSyncJob
      tags:
        - game-data
      summary: Persist a tenant-scoped provider synchronization job
      description: Service-only endpoint authenticated with the internal bearer secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueProviderSyncJobRequest"
      responses:
        "202":
          description: Job persisted or active duplicate returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSyncJobResponse"
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
      parameters:
        - *a2
  /internal/game-data/sync-jobs/{jobId}/run:
    post:
      operationId: runProviderSyncJob
      tags:
        - game-data
      summary: Claim and run one provider synchronization job attempt
      description: Service-only Queue target authenticated with the internal bearer secret.
      parameters:
        - *a2
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current durable job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSyncJobResponse"
          headers:
            X-Request-ID: *a1
        "401":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /internal/game-data/sync-jobs/run-next:
    post:
      operationId: recoverNextProviderSyncJob
      tags:
        - game-data
      summary: Run the next ready provider synchronization job
      description: Service-only Cron recovery path for durable jobs left ready after
        an interrupted Queue publication or delivery.
      responses:
        "200":
          description: Current durable job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSyncJobResponse"
          headers:
            X-Request-ID: *a1
        "204":
          description: No job is ready
          headers:
            X-Request-ID: *a1
        "401":
          $ref: "#/components/responses/ApiError"
      parameters:
        - *a2
  /players/me:
    get:
      operationId: getMyPlayerProfile
      tags:
        - players
      summary: Get the authenticated actor player profile
      responses:
        "200":
          description: Profile and linked game accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMyPlayerProfileResponse"
          headers:
            X-Request-ID: *a1
        "401":
          $ref: "#/components/responses/ApiError"
      parameters:
        - *a2
  /players/me/game-accounts:
    post:
      operationId: addMyPlayerGameAccount
      tags:
        - players
      summary: Add a declared EA game identifier to the personal profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerGameAccountInput"
      responses:
        "201":
          description: Idempotently linked account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddMyPlayerGameAccountResponse"
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
      parameters:
        - *a2
  /players/me/external-club:
    post:
      operationId: associateMyPlayerExternalClub
      tags:
        - players
      summary: Associate an EA Clubs club with the personal player profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssociateMyPlayerExternalClubRequest"
      responses:
        "201":
          description: Idempotently associated external club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssociateMyPlayerExternalClubResponse"
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
      parameters:
        - *a2
  /players/me/statistics:
    get:
      operationId: getMyStatistics
      tags:
        - players
      summary: Get personal official statistics for the authenticated player
      parameters:
        - *a2
        - name: competitionId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: teamId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: gameEdition
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - name: platform
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - name: position
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
      responses:
        "200":
          description: Aggregated personal statistics, or null when none exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMyStatisticsResponse"
          headers:
            X-Request-ID: *a1
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /players/me/matches:
    get:
      operationId: getMyMatches
      tags:
        - players
      summary: List personal match contributions projected from approved official
        results
      parameters:
        - *a2
        - name: competitionId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: teamId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: gameEdition
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - name: platform
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - name: position
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Cursor page of matched contributions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMyMatchesResponse"
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /players/me/recent-matches:
    get:
      operationId: getMyRecentMatches
      tags:
        - players
      summary: List recent provider matches in which the player appears, for
        associated ExternalClubs
      responses:
        "200":
          description: needs_club when no club is associated, needs_game_account when no
            identifier is registered, or ready appearances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMyRecentMatchesResponse"
          headers:
            X-Request-ID: *a1
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "502":
          $ref: "#/components/responses/ApiError"
      parameters:
        - *a2
  /identity/onboarding:
    get:
      operationId: getOnboardingStatus
      tags:
        - onboarding
      summary: Get the authenticated actor onboarding state
      responses:
        "200":
          description: Current onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
          headers:
            X-Request-ID: *a1
        "401":
          $ref: "#/components/responses/ApiError"
      parameters:
        - *a2
    patch:
      operationId: saveOnboardingProgress
      tags:
        - onboarding
      summary: Persist the current onboarding path and step without draft data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - path
                - currentStep
              properties:
                path:
                  anyOf:
                    - type: string
                      enum:
                        - player
                        - organization
                        - invitation
                    - type: "null"
                currentStep:
                  type: string
                  enum:
                    - intention
                    - organization
                    - competition
                    - game
                    - invitation
                    - game-account
                    - club
                    - team
                    - review
      responses:
        "200":
          description: Saved onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
      parameters:
        - *a2
  /identity/onboarding/organization:
    post:
      operationId: completeOrganizationOnboarding
      tags:
        - onboarding
      summary: Create an organization and complete the organization onboarding path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - competition
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                competition:
                  $ref: "#/components/schemas/CompetitionDraftInput"
                gameAccount:
                  anyOf:
                    - $ref: "#/components/schemas/PlayerGameAccountInput"
                    - type: "null"
      responses:
        "200":
          description: Completed organization onboarding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteOrganizationOnboardingResponse"
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
      parameters:
        - *a2
  /identity/onboarding/invitation:
    post:
      operationId: completeInvitationOnboarding
      tags:
        - onboarding
      summary: Accept an invitation and complete the invitation onboarding path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 1
                gameAccount:
                  anyOf:
                    - $ref: "#/components/schemas/PlayerGameAccountInput"
                    - type: "null"
      responses:
        "200":
          description: Completed invitation onboarding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteInvitationOnboardingResponse"
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
      parameters:
        - *a2
  /identity/onboarding/invitation/preview:
    post:
      operationId: inspectCompetitionInvitation
      tags:
        - onboarding
      summary: Inspect a competition invitation without consuming it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Sanitized competition invitation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectCompetitionInvitationResponse"
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
      parameters:
        - *a2
  /organizations/invitations/accept:
    post:
      operationId: acceptOrganizationInvitation
      tags:
        - organizations
      summary: Accept an organization invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Organization invitation accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - organizationId
                  - organizationName
                  - role
                properties:
                  organizationId:
                    type: string
                  organizationName:
                    type: string
                  role:
                    type: string
                    enum:
                      - organizer
                      - staff
                      - member
                  competitionId:
                    type:
                      - string
                      - "null"
                  competitionRole:
                    type:
                      - string
                      - "null"
                    enum:
                      - staff
                      - captain
                      - player
                      - null
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
      parameters:
        - *a2
  /identity/onboarding/player:
    post:
      operationId: completePlayerOnboarding
      tags:
        - onboarding
      summary: Create a personal profile and complete the player onboarding path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gameAccount:
                  anyOf:
                    - $ref: "#/components/schemas/PlayerGameAccountInput"
                    - type: "null"
                externalClub:
                  anyOf:
                    - $ref: "#/components/schemas/PlayerExternalClubSelectionInput"
                    - type: "null"
      responses:
        "200":
          description: Completed player onboarding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletePlayerOnboardingResponse"
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
      parameters:
        - *a2
  /organizations/name-availability:
    post:
      operationId: checkOrganizationNameAvailability
      tags:
        - organizations
      summary: Check whether a normalized organization name is globally available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
      responses:
        "200":
          description: Name availability
          content:
            application/json:
              schema:
                type: object
                required:
                  - available
                properties:
                  available:
                    type: boolean
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
      parameters:
        - *a2
  /competitions/invitations/accept:
    post:
      operationId: acceptCompetitionInvitation
      tags:
        - competitions
      summary: Accept a competition invitation and join its contextual membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Competition invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptCompetitionInvitationResponse"
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
      parameters:
        - *a2
  /roster-invitations/accept:
    post:
      operationId: acceptRosterInvitation
      tags:
        - players
      summary: Accept an invitation to a competition roster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Roster invitation accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - organizationId
                  - competitionId
                  - teamId
                  - playerProfileId
                  - gameAccountId
                  - role
                  - createdAt
                properties:
                  id:
                    type: string
                  organizationId:
                    type: string
                  competitionId:
                    type: string
                  teamId:
                    type: string
                  playerProfileId:
                    type: string
                  gameAccountId:
                    type:
                      - string
                      - "null"
                  role:
                    type: string
                    enum:
                      - player
                      - captain
                      - vice_captain
                  createdAt:
                    type: string
                    format: date-time
          headers:
            X-Request-ID: *a1
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
      parameters:
        - *a2
  /organizations/{organizationId}/competitions:
    get:
      operationId: listOrganizationCompetitions
      tags:
        - competitions
      summary: List competitions in an organization
      parameters:
        - *a2
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization competitions newest-first
          content:
